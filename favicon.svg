  <!-- Central Hub -->
  <circle cx="32" cy="32" r="5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="32" cy="14" r="2.5" fill="#ffffff"/>
  <circle cx="50" cy="24" r="2.5" fill="#10b981"/>
  <circle cx="50" cy="40" r="2.5" fill="#34d399"/>
  <circle cx="32" cy="50" r="2.5" fill="#ffffff"/>
  <circle cx="14" cy="40" r="2.5" fill="#10b981"/>
  <circle cx="14" cy="24" r="2.5" fill="#34d399"/>
</svg>
