<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Diamond -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#041610" stroke="url(#emeraldGrad)" stroke-width="2"/>
  <!-- Geometric Enterprise Nexus Node -->
  <path d="M32 14 L50 24 L50 40 L32 50 L14 40 L14 24 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
